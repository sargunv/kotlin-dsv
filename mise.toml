[settings]
experimental = true
pin = true

[hooks]
postinstall = ["hk install --mise"]

[tools]
java = "21.0.2"
dprint = "0.53.2"
hk = "1.40.0"
pkl = "0.30.2"
"aqua:facebook/ktfmt" = "0.62"

[tasks.build]
description = "Build and check all targets"
run = "./gradlew build"

[tasks."test:jvm"]
description = "Run JVM tests"
run = "./gradlew jvmTest"

[tasks."test:jsnode"]
description = "Run JS Node tests"
run = "./gradlew jsNodeTest"

[tasks."test:wasmjsnode"]
description = "Run WASM JS Node tests"
run = "./gradlew wasmJsNodeTest"

[tasks."test:native"]
description = "Run native tests for the current platform"
run = "./gradlew $( uname | grep -q Darwin && (uname -m | grep -q arm64 && echo macosArm64Test || echo macosX64Test) || echo linuxX64Test )"

[tasks.test]
description = "Run all tests"
depends = ["test:jvm", "test:jsnode", "test:wasmjsnode", "test:native"]

[tasks.docs]
description = "Serve documentation locally"
run = "./gradlew :mkdocsServe"

[tasks.check]
description = "Run all linting and formatting checks"
run = "hk check --all"

[tasks.fix]
description = "Auto-fix formatting issues"
run = "hk fix --all"

[tasks.tag]
description = "Create a release tag and push it"
usage = 'arg "<scope>" help="Version bump scope" {choices = ["major", "minor", "patch"]}'
run = '''
#!/usr/bin/env bash
set -euo pipefail
LAST=$(git describe --tags --abbrev=0)
CLEAN=${LAST#v}
IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
case "$1" in
  major) NEW="$((MAJOR+1)).0.0" ;;
  minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
  patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
  *) echo "scope must be major, minor, or patch" >&2; exit 1 ;;
esac
git tag -a "v${NEW}" -m "Release v${NEW}"
echo "Created tag v${NEW}. Run: git push --follow-tags"
'''

[tasks._ktfmt]
description = "Called by dprint.json"
hide = true
run = 'java -jar {{ tools["aqua:facebook/ktfmt"].path }}/ktfmt'
