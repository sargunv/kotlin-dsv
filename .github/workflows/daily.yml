name: Daily

on:
    schedule:
        - cron: 00 10 * * *
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-last-run:
        timeout-minutes: 5
        runs-on: ubuntu-latest
        # The workflow-runs API rejects a token without this, and the top-level
        # block above grants only `contents: read`.
        permissions:
            actions: read
        steps:
            - uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
              id: check-last-run
              with:
                  route: |
                      GET /repos/${{github.repository}}/actions/workflows/daily.yml/runs?per_page=1&status=completed
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        outputs:
            last_sha: |
                ${{ fromJson(steps.check-last-run.outputs.data).workflow_runs[0].head_sha }}

    publish-snapshot:
        needs: [check-last-run]
        if: ${{ needs.check-last-run.outputs.last_sha != github.sha }}
        timeout-minutes: 60
        runs-on: ubuntu-latest
        environment:
            name: maven-central
            url: https://central.sonatype.com/repository/maven-snapshots/dev/sargunv/kotlin-dsv/
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # .mise/bin/version-args reads the release tag off the checkout.
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
            - run: mise run publish:snapshot
              env:
                  ORG_GRADLE_PROJECT_mavenCentralUsername:
                      ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  ORG_GRADLE_PROJECT_mavenCentralPassword:
                      ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKey:
                      ${{ secrets.GPG_PRIVATE_KEY }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
                      ${{ secrets.GPG_PASSPHRASE }}
